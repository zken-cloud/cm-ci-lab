<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access token required — CodeMender Lab</title>
<style>
  :root{ color-scheme: light dark; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:1.2rem;
        background:#f5f8f8; color:#0f1c1e;
        font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .card{ background:#fff; border:1px solid #dbe5e5; border-radius:16px;
         padding:2.4rem 2rem; max-width:32rem; width:100%; text-align:center;
         box-shadow:0 1px 2px rgba(15,28,30,.05),0 10px 30px -14px rgba(15,28,30,.2); }
  .badge{ width:44px; height:44px; margin:0 auto .6rem; color:#0c9c8b; display:block; }
  h1{ font-size:1.35rem; letter-spacing:-.02em; margin:.2rem 0 .35rem; }
  p{ color:#5f7376; margin:0 0 1.4rem; font-size:.95rem; line-height:1.5; }
  /* horizontal row: [ input (with toggle) ] [ View site ] */
  .row{ display:flex; gap:.55rem; align-items:stretch; }
  .field{ position:relative; flex:1; display:flex; }
  .field input{ width:100%; font:inherit; padding:.65rem 2.7rem .65rem .8rem;
                border:1px solid #c3d3d3; border-radius:10px; background:#fff; color:#0f1c1e; }
  .field input:focus{ outline:2px solid #0c9c8b; outline-offset:1px; border-color:#0c9c8b; }
  .toggle{ position:absolute; right:.35rem; top:50%; transform:translateY(-50%);
           background:none; border:0; padding:.35rem; cursor:pointer; color:#5f7376;
           display:grid; place-items:center; border-radius:7px; }
  .toggle:hover{ color:#0c9c8b; }
  .toggle svg{ width:19px; height:19px; }
  .submit{ font:inherit; font-weight:650; padding:.65rem 1.2rem; border:0; border-radius:10px;
           background:#0c9c8b; color:#fff; cursor:pointer; white-space:nowrap; }
  .submit:hover{ filter:brightness(1.06); }
  @media (prefers-color-scheme: dark){
    body{ background:#0a1214; color:#e9f1f0; }
    .card{ background:#0f1a1c; border-color:#1e2f31;
           box-shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.7); }
    p{ color:#8aa09f; } .badge{ color:#2ad4be; }
    .field input{ background:#0a1416; color:#e9f1f0; border-color:#2a3d3f; }
    .toggle{ color:#8aa09f; }
  }
</style>
</head>
<body>
  <!-- method=get submits ?token=<value> to the current URL; nginx validates it,
       sets the site_token cookie, and serves the page. -->
  <form class="card" method="get" autocomplete="off">
    <svg class="badge" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2 4 5v6c0 5 3.4 8.3 8 11 4.6-2.7 8-6 8-11V5l-8-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="m8.5 12 2.4 2.4L15.8 9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Access token required</h1>
    <p>Enter the access token to view the CodeMender&nbsp;Lab.</p>
    <div class="row">
      <div class="field">
        <input id="tok" type="password" name="token" placeholder="Access token"
               aria-label="Access token" autocomplete="off" autofocus required>
        <button type="button" id="toggle" class="toggle" aria-label="Show token" title="Show token">
          <svg id="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <button type="submit" class="submit">View site</button>
    </div>
  </form>
  <script>
    (function(){
      var inp = document.getElementById('tok'),
          btn = document.getElementById('toggle'),
          eyeOpen  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
          eyeOff   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.7 9.7 0 0 1 12 5c7 0 10.5 7 10.5 7a17 17 0 0 1-3.3 4.2M6.2 6.6A17 17 0 0 0 1.5 12S5 19 12 19a9.8 9.8 0 0 0 4-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
      btn.addEventListener('click', function(){
        var show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        btn.innerHTML = show ? eyeOff : eyeOpen;
        btn.setAttribute('aria-label', show ? 'Hide token' : 'Show token');
        btn.setAttribute('title', show ? 'Hide token' : 'Show token');
        inp.focus();
      });
    })();
  </script>
</body>
</html>
