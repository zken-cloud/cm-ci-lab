# --- Token gate --------------------------------------------------------------
# Second access layer, on top of IAP. A request must present the shared token,
# either as ?token=imjustatoken (which then sets a cookie so navigation keeps
# working) or via the site_token cookie. Without a valid token, everything 403s.
# Net effect: a viewer needs BOTH a @google.com IAP login AND the token.
map $arg_token $token_from_query {
    "imjustatoken" 1;
    default        0;
}
map $cookie_site_token $token_from_cookie {
    "imjustatoken" 1;
    default        0;
}
map "$token_from_query$token_from_cookie" $token_ok {
    "00"    0;
    default 1;
}
# Set the cookie only when a valid ?token= is presented (empty => header skipped).
map $arg_token $token_set_cookie {
    "imjustatoken" "site_token=imjustatoken; Path=/; Max-Age=43200; HttpOnly; Secure; SameSite=Lax";
    default        "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx listens on 8080 (Cloud Run) behind the HTTPS LB. Emit RELATIVE
    # redirects so a 301 never leaks the internal :8080 port to the browser.
    absolute_redirect off;

    # These pages are re-cut on every deploy, and nginx would otherwise send only
    # ETag/Last-Modified — with no Cache-Control a browser caches HTML
    # heuristically, which served the OLD landing page for hours after / moved
    # from /smoke to /gha. "no-cache" still allows a 304 revalidation; it just
    # forbids serving from cache without asking.
    add_header Cache-Control "no-cache";

    # Token gate: persist a valid ?token= as a cookie, then require a valid token
    # (query or cookie) for everything else. Denials render a clean 200 token
    # page via an internal rewrite — a raw 403 through the LB+IAP produced
    # ERR_INVALID_RESPONSE in the browser.
    add_header Set-Cookie $token_set_cookie;
    if ($token_ok = 0) {
        rewrite ^ /_gate last;
    }

    location = /_gate {
        internal;
        try_files /gate.html =404;
    }

    # GHA variant guide is the LANDING page at / , and also served at /gha so
    # existing links keep working. Serve the page DIRECTLY — no 301 redirect,
    # because browsers cache 301s permanently and a redirect built from nginx's
    # :8080 listen port poisoned that cache once.
    location = / {
        try_files /gha/index.html =404;
    }
    location = /gha {
        try_files /gha/index.html =404;
    }
    location /gha/ {
        try_files $uri /gha/index.html;
    }

    # GHA Workload Identity setup guide is HIDDEN — pulled from the live site
    # pending review. webapp/gha-setup/index.html is kept in the repo for
    # revival; it is just not routed here.

    # Smoke Test (local laptop flow) lives at /smoke. Same no-redirect pattern.
    location = /smoke {
        try_files /smoke/index.html =404;
    }
    location /smoke/ {
        try_files $uri /smoke/index.html;
    }

    # Cloud Build guide is HIDDEN for the shared-project preview — the shared
    # cloud-llm-preview1 project lacks the GCS / Secret Manager access that
    # `gcloud builds submit` and the pipeline need. The webapp/index.html file is
    # kept in the repo for later revival; it is just not routed here.

    # Antigravity Skills guide is HIDDEN for now — the AGY harness refused to run
    # the scan, so the /skills page is shelved. webapp/skills/index.html is kept in
    # the repo (and the skill itself lives at github.com/zken-cloud/cm-skills); it is
    # just not routed here.

    # Legacy EAP guide, preserved under /eap. Same no-redirect pattern.
    location = /eap {
        try_files /eap/index.html =404;
    }
    location /eap/ {
        try_files $uri /eap/index.html;
    }

    # Anything else falls through to the GitHub Actions landing page.
    location / {
        try_files $uri /gha/index.html;
    }
}
