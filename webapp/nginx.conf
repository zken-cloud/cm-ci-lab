server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx listens on 8080 (Cloud Run) behind the HTTPS LB. Emit RELATIVE
    # redirects so a 301 never leaks the internal :8080 port to the browser.
    absolute_redirect off;

    # GHA variant guide, staged under /gha (its own page; falls back within /gha).
    location = /gha { return 301 /gha/; }
    location /gha/ {
        try_files $uri /gha/index.html;
    }

    # Cloud Build guide — serve index.html for any other path.
    location / {
        try_files $uri /index.html;
    }
}
