server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx listens on 8080 (Cloud Run) behind the HTTPS LB. Emit RELATIVE
    # redirects so a 301 never leaks the internal :8080 port to the browser.
    absolute_redirect off;

    # GHA variant guide, staged under /gha. Serve the page DIRECTLY for both /gha
    # and /gha/ — no 301 redirect, because browsers cache 301s permanently and a
    # redirect built from nginx's :8080 listen port poisoned that cache once.
    location = /gha {
        try_files /gha/index.html =404;
    }
    location /gha/ {
        try_files $uri /gha/index.html;
    }

    # Smoke Test (local laptop flow) is the LANDING page at / , and also served
    # at /smoke so existing links keep working. Same no-redirect pattern.
    location = / {
        try_files /smoke/index.html =404;
    }
    location = /smoke {
        try_files /smoke/index.html =404;
    }
    location /smoke/ {
        try_files $uri /smoke/index.html;
    }

    # Cloud Build guide is HIDDEN for the shared-project preview — the shared
    # cloud-llm-preview1 project lacks the GCS / Secret Manager access that
    # `gcloud builds submit` and the pipeline need. The webapp/index.html file is
    # kept in the repo for later revival; it is just not routed here.

    # Antigravity Skills guide, under /skills. Same no-redirect pattern.
    location = /skills {
        try_files /skills/index.html =404;
    }
    location /skills/ {
        try_files $uri /skills/index.html;
    }

    # Legacy EAP guide, preserved under /eap. Same no-redirect pattern.
    location = /eap {
        try_files /eap/index.html =404;
    }
    location /eap/ {
        try_files $uri /eap/index.html;
    }

    # Anything else falls through to the Smoke Test landing page.
    location / {
        try_files $uri /smoke/index.html;
    }
}
